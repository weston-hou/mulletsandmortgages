name: Integrated e2e (staging)

# Real-services integration test against a staging deploy. Runs on every push to
# main (and on demand). Gated on the repo variable STAGING_ENABLED so it stays
# dormant until staging exists; the test also self-skips without STAGING_BASE_URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging:
    name: Staging integration
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run integrated e2e
        run: npm run test:staging
        env:
          CI: "true"
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_ADMIN_KEY: ${{ secrets.STAGING_ADMIN_KEY }}
